services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: ${ENV_FILE:-.env}
    environment:
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL_DOCKER:-postgresql+psycopg2://postgres:postgres@db:5432/app}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:postgres@db:5432/app}
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL_DOCKER:-postgresql+psycopg2://postgres:postgres@db:5432/app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://postgres:postgres@db:5432/app}
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL_DOCKER:-postgresql+psycopg2://postgres:postgres@db:5432/app}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    env_file: ${ENV_FILE:-.env}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
